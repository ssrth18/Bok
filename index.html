<!-- ===== X / Twitter post cards for Saved (v3). Paste right before </body>. Remove any older copy first. ===== -->
<style>
.wrow.xr .wic,.wrow.xr .wt,.wrow.xr .wh{display:none}
.wrow.xr{padding:12px;align-items:flex-start}
.wrow.xr .wbody{min-width:0}
.xp{display:block;text-decoration:none;color:#e7e9ea;background:#000;border-radius:24px;padding:16px 16px 14px;
 border:1px solid rgba(255,255,255,.14);
 outline:2.5px solid var(--ac);outline-offset:3px;
 box-shadow:0 10px 26px rgba(0,0,0,.22);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 transition:transform .3s ease,box-shadow .2s;margin:4px 4px 6px}
.xp:active{transform:scale(.985)}
.xp-h{display:flex;align-items:center;gap:12px}
.xp-av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:#2f3336}
.xp-who{min-width:0;display:flex;flex-direction:column;gap:2px}
.xp-n{display:flex;align-items:center;gap:5px;font-weight:700;font-size:calc(17px*var(--ts,1));line-height:1.2;color:#fff}
.xp-n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp-v{width:19px;height:19px;flex:none}
.xp-u{font-size:calc(15px*var(--ts,1));color:#71767b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp-t{margin:12px 0 0;font-size:calc(18px*var(--ts,1));line-height:1.45;color:#e7e9ea;white-space:pre-wrap;overflow-wrap:anywhere}
.xp-img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:16px;margin-top:12px;border:1px solid rgba(255,255,255,.12)}
.xp-m{display:flex;gap:18px;margin-top:14px;font-size:calc(15px*var(--ts,1));color:#71767b}
.xp-m b{font-weight:500}
.xp-sk{height:150px;border-radius:24px;margin:4px;background:linear-gradient(100deg,#0b0b0b 30%,#1c1c1c 50%,#0b0b0b 70%);background-size:220% 100%;animation:sh 1.3s linear infinite;outline:2.5px solid var(--ac);outline-offset:3px}
</style>
<script>
(()=>{
const RX=/(?:^|\/\/)(?:www\.|mobile\.|m\.)?(?:x|twitter|fxtwitter|vxtwitter|fixupx|fixvx)\.com\/([^\/?#]+)\/status(?:es)?\/(\d+)/i;
const e=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const K="lp_posts3";let C={};try{C=JSON.parse(localStorage[K]||"{}")}catch{}
const save=()=>{try{localStorage[K]=JSON.stringify(C)}catch{try{C={};localStorage.removeItem(K)}catch{}}};
const fmt=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,"")+"M":n>=1e4?Math.round(n/1e3)+"K":n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,"")+"K":String(n)};
const BADGE='<svg class="xp-v" viewBox="0 0 22 22" aria-label="Verified"><path fill="#1d9bf0" d="M20.4 11c0-1.2-.7-2.3-1.7-2.8.4-1.1.2-2.4-.7-3.3s-2.2-1.1-3.3-.7C14.2 3.2 13.1 2.5 11.9 2.5S9.6 3.2 9.1 4.2c-1.1-.4-2.4-.2-3.3.7s-1.1 2.2-.7 3.3c-1 .5-1.7 1.6-1.7 2.8s.7 2.3 1.7 2.8c-.4 1.1-.2 2.4.7 3.3s2.2 1.1 3.3.7c.5 1 1.6 1.7 2.8 1.7s2.3-.7 2.8-1.7c1.1.4 2.4.2 3.3-.7s1.1-2.2.7-3.3c1-.5 1.7-1.6 1.7-2.8z"/><path fill="#fff" d="M10.2 14.9l-2.9-2.9 1.1-1.1 1.8 1.8 4.4-4.4 1.1 1.1z"/></svg>';
function card(p,url){
 const img=p.img?`<img class="xp-img" src="${e(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:"";
 return `<a class="xp" href="${e(url)}" target="_blank" rel="noopener noreferrer"><div class="xp-h"><img class="xp-av" src="${e(p.av)}" alt="" referrerpolicy="no-referrer"><div class="xp-who"><div class="xp-n"><span>${e(p.name)}</span>${p.ver?BADGE:""}</div><div class="xp-u">@${e(p.user)}</div></div></div><p class="xp-t">${e(p.text)}</p>${img}<div class="xp-m"><span><b>${fmt(p.likes)}</b> likes</span><span><b>${fmt(p.replies)}</b> replies</span></div></a>`}
const J=async u=>{const r=await fetch(u);if(!r.ok)throw Error(new URL(u).hostname+" "+r.status);return r.json()};
async function get(user,id){
 if(C[id])return C[id];
 const errs=[];
 const src=[
  async()=>{const t=(await J(`https://api.fxtwitter.com/${user}/status/${id}`)).tweet;if(!t)throw Error("empty");const a=t.author||{};
   return{name:a.name,user:a.screen_name,av:(a.avatar_url||"").replace("_normal","_200x200"),ver:!!(a.verification?.verified||a.verified||a.is_blue_verified||a.blue_verified),text:t.text,likes:t.likes,replies:t.replies,img:t.media?.photos?.[0]?.url}},
  async()=>{const t=await J(`https://api.vxtwitter.com/${user}/status/${id}`);if(!t||!t.text&&!t.user_name)throw Error("empty");
   return{name:t.user_name,user:t.user_screen_name,av:(t.user_profile_image_url||"").replace("_normal","_200x200"),ver:!!(t.is_blue_verified||t.verified),text:t.text,likes:t.likes,replies:t.replies,img:(t.media_extended||[]).find(m=>m.type==="image")?.url}},
  async()=>{const tok=((Number(id)/1e15)*Math.PI).toString(36).replace(/(0+|\.)/g,"");const t=await J(`https://cdn.syndication.twimg.com/tweet-result?id=${id}&lang=en&token=${tok}`);if(!t||!t.user)throw Error("empty");
   return{name:t.user.name,user:t.user.screen_name,av:(t.user.profile_image_url_https||"").replace("_normal","_200x200"),ver:!!(t.user.is_blue_verified||t.user.verified),text:(t.text||"").replace(/\s*https:\/\/t\.co\/\w+$/,""),likes:t.favorite_count,replies:t.conversation_count,img:t.photos?.[0]?.url}}
 ];
 for(const f of src){try{const p=await f();if(p&&p.name){C[id]=p;save();return p}}catch(x){errs.push(x.message==="Failed to fetch"?"blocked/offline":x.message)}}
 throw Error(errs.join(", "))}
function upgrade(row){
 if(row.dataset.px)return;
 const a=row.querySelector("a.wt");if(!a)return;
 const m=RX.exec(a.href);if(!m)return;
 row.dataset.px="1";
 const body=row.querySelector(".wbody");
 const put=p=>{if(!row.isConnected)return;row.classList.add("xr");body.querySelector(".xp,.xp-sk")?.remove();body.insertAdjacentHTML("afterbegin",card(p,a.href))};
 if(C[m[2]]){put(C[m[2]]);return}
 row.classList.add("xr");body.insertAdjacentHTML("afterbegin",'<div class="xp-sk"></div>');
 get(m[1],m[2]).then(put).catch(er=>{if(!row.isConnected)return;row.classList.remove("xr");body.querySelector(".xp-sk")?.remove();body.insertAdjacentHTML("beforeend",`<div class="wn"><b>Post preview</b><p>Couldn't load (${e(er.message)}). Tap ⋯ to try again later.</p></div>`);delete row.dataset.px;row.dataset.px="1"})
}
const boot=()=>{const main=document.getElementById("main");if(!main){setTimeout(boot,150);return}
 const run=()=>main.querySelectorAll(".wrow:not([data-px])").forEach(upgrade);
 new MutationObserver(run).observe(main,{childList:true});run();window.lpPostsRun=run;console.log("[post cards] ready")};
if(document.readyState==="loading")addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
<!-- ===== end X / Twitter post cards ===== -->
